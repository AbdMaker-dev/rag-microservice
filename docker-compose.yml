# Pile complète du service : base d'index, moteur d'inférence, API.
# Identique en local et sur le serveur. CPU uniquement au lancement.
name: lawalschool-rag

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    # Aucun port publié : seule l'API joint la base, par le réseau Docker.
    # Pour l'inspecter depuis l'hôte :
    #   docker compose exec postgres psql -U rag -d ragdb
    expose:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Active l'extension vector à la création du volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-ragdb}']
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:0.14.1
    # Pas de port publié non plus : l'API est le seul client.
    expose:
      - '11434'
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: '1'
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Un seul modèle sert la génération et la lecture de pages ; le modèle
      # d'embedding est petit et peut rester chargé à côté.
      OLLAMA_MAX_LOADED_MODELS: '2'
      OLLAMA_KEEP_ALIVE: 30m
      # Une page de PDF produit un long contexte visuel.
      OLLAMA_NUM_PARALLEL: '1'
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
    # Serveur Linux avec GPU : décommenter pour l'activer.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:0.14.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      /bin/sh -c "
      ollama pull ${LLM_MODEL:-qwen2.5vl:7b};
      ollama pull ${EMBEDDING_MODEL:-bge-m3};
      "
    restart: 'no'

  api:
    build: .
    # Tout le .env est transmis au conteneur, sinon les réglages qui n'ont pas
    # de ligne dans `environment` seraient silencieusement ignorés.
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # Ces trois valeurs écrasent le .env : à l'intérieur du réseau Docker,
      # les services se joignent par leur nom, pas par localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ragdb}
      OLLAMA_BASE_URL: http://ollama:11434
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5vl:7b}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    volumes:
      # Voix Piper embarquées, montées en lecture seule.
      - ./data/voices:/app/data/voices:ro
    ports:
      # Jamais exposé au-delà de la machine : seule la plateforme appelle.
      - '127.0.0.1:8000:8000'

volumes:
  postgres-data:
  ollama-models:
